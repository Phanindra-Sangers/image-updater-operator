# This rule is not used by the project image-updater-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to images.saphire.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: image-updater-operator
    app.kubernetes.io/managed-by: kustomize
  name: imagepolicy-viewer-role
rules:
- apiGroups:
  - images.saphire.com
  resources:
  - imagepolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - images.saphire.com
  resources:
  - imagepolicies/status
  verbs:
  - get
