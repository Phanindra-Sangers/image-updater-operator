# This rule is not used by the project image-updater-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over images.saphire.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: image-updater-operator
    app.kubernetes.io/managed-by: kustomize
  name: imagepolicy-admin-role
rules:
- apiGroups:
  - images.saphire.com
  resources:
  - imagepolicies
  verbs:
  - '*'
- apiGroups:
  - images.saphire.com
  resources:
  - imagepolicies/status
  verbs:
  - get
