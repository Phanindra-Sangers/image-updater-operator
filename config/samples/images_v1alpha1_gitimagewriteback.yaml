# Git write-back for ArgoCD-managed workloads. The operator clones the repo,
# updates image values located by marker comments, and commits/pushes so ArgoCD
# syncs the change. It does NOT patch the live cluster for these workloads.
#
# In the target repo, mark the value to update, e.g. in a Helm values.yaml:
#
#   image:
#     repository: ghcr.io/org/app
#     tag: 1.2.0  # {"$image-policy": "app-stable"}
#
# or a full image string in a manifest:
#
#   - image: ghcr.io/org/app:1.2.0  # {"$image-policy": "app-stable:image"}
---
# HTTPS-token credentials (a PAT in the "password" or "token" key).
apiVersion: v1
kind: Secret
metadata:
  name: git-https
  namespace: default
type: Opaque
stringData:
  username: git
  password: <personal-access-token>
---
apiVersion: images.improving.com/v1alpha1
kind: GitImageWriteback
metadata:
  name: prod-deploy
  namespace: default
spec:
  url: https://github.com/org/deploy.git
  branch: main
  path: ./envs/prod          # subtree scanned for marker comments
  interval: 5m
  auth:
    httpsSecretRef:
      name: git-https
    # For SSH instead, create a Secret with keys identity / known_hosts / password
    # and reference it here:
    # sshSecretRef:
    #   name: git-ssh
  commit:
    authorName: image-updater-operator
    authorEmail: image-updater@improving.com
    messageTemplate: |
      chore(images): automated image update

      {{updates}}
    push: true
  policies:                  # optional allowlist; empty means any policy named by a marker
    - app-stable
