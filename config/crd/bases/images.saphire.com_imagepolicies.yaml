---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: imagepolicies.images.saphire.com
spec:
  group: images.saphire.com
  names:
    kind: ImagePolicy
    listKind: ImagePolicyList
    plural: imagepolicies
    singular: imagepolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.imageRepository
      name: Repository
      type: string
    - jsonPath: .status.latestTag
      name: LatestTag
      type: string
    - jsonPath: .spec.updateMode
      name: Mode
      type: string
    - jsonPath: .status.lastScanTime
      name: LastScan
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ImagePolicy is the Schema for the imagepolicies API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ImagePolicy
            properties:
              filterTags:
                description: filterTags optionally pre-filters the tag list before
                  the policy is applied.
                properties:
                  pattern:
                    description: pattern is an RE2 regular expression; only matching
                      tags are considered.
                    minLength: 1
                    type: string
                required:
                - pattern
                type: object
              imageRepository:
                description: |-
                  imageRepository is the registry repository to scan, without a tag, e.g.
                  "docker.io/library/nginx", "ghcr.io/org/app", or "<account>.dkr.ecr.<region>.amazonaws.com/app".
                  A workload container that references this policy has its image set to
                  "<imageRepository>:<selectedTag>".
                minLength: 1
                type: string
              interval:
                default: 5m
                description: interval is how often the registry is scanned. Defaults
                  to 5m.
                type: string
              policy:
                description: policy is the tag selection rule.
                maxProperties: 1
                minProperties: 1
                properties:
                  alphabetical:
                    description: OrderedPolicy selects a tag by pure numerical or
                      alphabetical ordering.
                    properties:
                      order:
                        default: desc
                        description: order is the sort direction. Defaults to desc.
                        enum:
                        - asc
                        - desc
                        type: string
                    type: object
                  numerical:
                    description: OrderedPolicy selects a tag by pure numerical or
                      alphabetical ordering.
                    properties:
                      order:
                        default: desc
                        description: order is the sort direction. Defaults to desc.
                        enum:
                        - asc
                        - desc
                        type: string
                    type: object
                  regex:
                    description: RegexPolicy filters tags by a regular expression
                      and orders the matches.
                    properties:
                      extract:
                        description: |-
                          extract optionally rewrites each matching tag before ordering, using Go's
                          regexp expansion syntax (e.g. "$1" to keep the first capture group). When
                          empty, the full tag is used for ordering but the original tag is still applied.
                        type: string
                      numeric:
                        description: |-
                          numeric, when true, orders the extracted values numerically rather than
                          lexicographically (so "10" sorts after "9").
                        type: boolean
                      order:
                        default: desc
                        description: |-
                          order is the sort direction; the winning tag is the last one after sorting.
                          Defaults to desc (highest/newest first).
                        enum:
                        - asc
                        - desc
                        type: string
                      pattern:
                        description: pattern is an RE2 regular expression matched
                          against each tag.
                        minLength: 1
                        type: string
                    required:
                    - pattern
                    type: object
                  semver:
                    description: SemverPolicy selects the highest tag that satisfies
                      a semver range.
                    properties:
                      range:
                        description: |-
                          range is a semver constraint, e.g. ">=1.2.0 <2.0.0" or "~1.2.x".
                          See https://github.com/Masterminds/semver for the supported grammar.
                        minLength: 1
                        type: string
                    required:
                    - range
                    type: object
                type: object
              registryRef:
                description: registryRef configures how the controller authenticates
                  to the registry.
                properties:
                  insecure:
                    description: |-
                      insecure allows talking to registries over plain HTTP. Use only for trusted
                      in-cluster registries.
                    type: boolean
                  secretName:
                    description: |-
                      secretName references a Secret of type kubernetes.io/dockerconfigjson in the
                      same namespace as the ImagePolicy (the same shape as an imagePullSecret).
                      When empty, the controller falls back to the cloud keychain (ECR/GCR/ACR
                      ambient credentials) and the host docker config.
                    type: string
                type: object
              suspend:
                description: suspend pauses scanning and updates for this policy when
                  true.
                type: boolean
              updateMode:
                default: Automatic
                description: |-
                  updateMode controls what happens when a newer tag is selected. Defaults to Automatic.
                  A workload may override this via the update-mode annotation.
                enum:
                - Automatic
                - Approval
                - DryRun
                type: string
            required:
            - imageRepository
            - policy
            type: object
          status:
            description: status defines the observed state of ImagePolicy
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the ImagePolicy resource.
                  Condition types: "Ready" (last scan succeeded and a tag is selected).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastScanTime:
                description: lastScanTime is when the registry was last scanned successfully.
                format: date-time
                type: string
              latestImage:
                description: latestImage is the fully-qualified image reference (repository:tag)
                  for latestTag.
                type: string
              latestTag:
                description: latestTag is the tag selected by the policy at the last
                  successful scan.
                type: string
              observedGeneration:
                description: observedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              scannedTags:
                description: scannedTags is the number of tags returned by the registry
                  at the last scan.
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
