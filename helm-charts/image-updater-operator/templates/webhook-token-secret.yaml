{{- if and .Values.webhookReceiver.enabled .Values.webhookReceiver.token (not .Values.webhookReceiver.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "image-updater-operator.fullname" . }}-webhook-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "image-updater-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.webhookReceiver.token | quote }}
{{- end }}
