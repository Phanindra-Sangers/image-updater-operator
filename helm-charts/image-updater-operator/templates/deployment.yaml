apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "image-updater-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "image-updater-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "image-updater-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "image-updater-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "image-updater-operator.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
            - --health-probe-bind-address=:{{ .Values.healthProbe.port }}
            - --metrics-bind-address={{ .Values.metrics.bindAddress }}
            {{- if .Values.webhookReceiver.enabled }}
            - --webhook-receiver-bind-address=:{{ .Values.webhookReceiver.port }}
            {{- else }}
            - --enable-webhook-receiver=false
            {{- end }}
            {{- if .Values.dashboard.enabled }}
            - --dashboard-bind-address=:{{ .Values.dashboard.port }}
            {{- else }}
            - --enable-dashboard=false
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if and .Values.webhookReceiver.enabled (or .Values.webhookReceiver.token .Values.webhookReceiver.existingSecret) }}
          env:
            - name: WEBHOOK_RECEIVER_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.webhookReceiver.existingSecret }}
                  name: {{ .Values.webhookReceiver.existingSecret }}
                  key: {{ .Values.webhookReceiver.existingSecretKey }}
                  {{- else }}
                  name: {{ include "image-updater-operator.fullname" . }}-webhook-token
                  key: token
                  {{- end }}
          {{- end }}
          ports:
            {{- if .Values.webhookReceiver.enabled }}
            - name: webhook
              containerPort: {{ .Values.webhookReceiver.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.dashboard.enabled }}
            - name: dashboard
              containerPort: {{ .Values.dashboard.port }}
              protocol: TCP
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.healthProbe.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.healthProbe.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
