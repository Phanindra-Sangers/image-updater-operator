{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "image-updater-operator.fullname" . }}-manager-role
  labels:
    {{- include "image-updater-operator.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, patch, update, watch]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [daemonsets, deployments, replicasets, statefulsets]
  verbs: [get, list, patch, update, watch]
- apiGroups: [batch]
  resources: [cronjobs, jobs]
  verbs: [get, list, patch, update, watch]
- apiGroups: [images.improving.com]
  resources: [imagepolicies]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [images.improving.com]
  resources: [imagepolicies/finalizers]
  verbs: [update]
- apiGroups: [images.improving.com]
  resources: [imagepolicies/status]
  verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "image-updater-operator.fullname" . }}-manager-rolebinding
  labels:
    {{- include "image-updater-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "image-updater-operator.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "image-updater-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
